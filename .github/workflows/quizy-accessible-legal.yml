name: Add accessible Quizy legal button
on:
  push:
    branches: [main]
    paths: [".quizy-accessible-legal-trigger"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add accessible legal button
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'quizyQuickLegal' in s:
              raise SystemExit('Accessible legal button already present')
          marker='</body>'
          if marker not in s:
              raise SystemExit('body marker not found')
          block='''<button id="quizyQuickLegal" type="button" aria-label="About and Legal Information">ⓘ About Quizy</button>
          <style>
          #quizyQuickLegal{position:fixed;right:14px;bottom:14px;z-index:9998;border:0;border-radius:999px;padding:10px 14px;font-weight:800;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.16);cursor:pointer;background:#fff;color:#222}
          </style>
          <script>
          (function(){
            function openQuizyLegal(){
              if(typeof showQuizyLegal==='function'){showQuizyLegal();return;}
              var w=document.createElement('div');
              w.className='cloud-modal-back';
              w.innerHTML='<div class="cloud-modal card" style="max-height:88vh;overflow:auto;text-align:left"><h2>🧭 Quizy — Adventure Quiz</h2><p><strong>© 2026 Uche Promise Egbe</strong><br>Owner / Creator: Uche Promise Egbe / Promise U. Egbe<br>Contact: 0706 424 2015</p><h3>Copyright &amp; Ownership</h3><p>Quizy and its original game experience, source code, question-bank work and original content are owned by Uche Promise Egbe, subject to applicable third-party rights and licences.</p><h3>Terms of Use</h3><p>For testing and educational use. Do not copy, reproduce, publish, redistribute, resell, rebrand, modify or commercially exploit Quizy or its protected materials without permission.</p><h3>Third-Party Licences</h3><p>Some software, media, fonts or other components may have separate third-party licence terms.</p><h3>Brand / Trademark</h3><p>Quizy name and branding are part of the project identity; trademark rights are separate from copyright ownership.</p><button class="btn primary" id="quizyQuickClose">Close</button></div>';
              document.body.appendChild(w);
              document.getElementById('quizyQuickClose').onclick=function(){w.remove()};
              w.onclick=function(e){if(e.target===w)w.remove()};
            }
            document.addEventListener('DOMContentLoaded',function(){
              var b=document.getElementById('quizyQuickLegal');
              if(b)b.onclick=openQuizyLegal;
            });
          })();
          </script>
          '''
          s=s.replace(marker,block+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Quizy legal information directly accessible"
          git push
      - name: Remove updater
        run: |
          rm -f .github/workflows/quizy-accessible-legal.yml .quizy-accessible-legal-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time accessible legal updater"
          git push
