name: Final Quizy welcome and legal polish
on:
  push:
    branches: [main]
    paths: [".quizy-final-polish-trigger"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove the floating legal button added by the previous patch.
          s=re.sub(r'<button id="quizyQuickLegal".*?</script>\s*\n\s*</body>', '</body>', s, flags=re.S)

          # Put About Quizy directly on the first dashboard/start screen.
          if 'id="aboutQuizy"' not in s:
              needle='<button class="btn ghost" id="board">🏆 Class Leaderboard</button>'
              repl='<button class="btn ghost" id="board">🏆 Class Leaderboard</button><button class="btn ghost" id="aboutQuizy">ⓘ About Quizy</button>'
              if needle not in s:
                  raise SystemExit('Start dashboard button target not found')
              s=s.replace(needle,repl,1)
              needle2="document.getElementById('board').onclick=leaderboard;"
              repl2="document.getElementById('board').onclick=leaderboard;document.getElementById('aboutQuizy').onclick=showQuizyLegal;"
              if needle2 not in s:
                  raise SystemExit('Start dashboard binding target not found')
              s=s.replace(needle2,repl2,1)

          # Replace legal copy with the owner's requested wording.
          s=re.sub(
              r"function showQuizyLegal\(\)\{.*?\n\}\n function accountLabel",
              '''function showQuizyLegal(){const w=document.createElement('div');w.id='quizyLegalModal';w.className='cloud-modal-back';w.innerHTML='<div class="cloud-modal card" style="max-height:88vh;overflow:auto;text-align:left"><h2 style="text-align:center">🧭 Quizy — Adventure Quiz</h2><p style="text-align:center;font-weight:900">Original educational game</p><div style="padding:14px;border:1px solid var(--line);border-radius:16px;background:#f7f8fb"><strong>© 2026 Uche Promise Egbe</strong><br>Owner / Creator: Uche Promise Egbe / Promise U. Egbe<br>Contact: <a href="tel:07064242015">0706 424 2015</a></div><h3>Copyright &amp; Ownership</h3><p>Quizy, including its original game experience, source code, question-bank work, written content, visual identity and original materials, is owned by Uche Promise Egbe.</p><h3>Terms of Use</h3><p>Quizy is an original educational product owned by Uche Promise Egbe. You may use Quizy for its intended educational purpose. Copying, reproducing, publishing, redistributing, reselling, rebranding, modifying or commercially exploiting Quizy or its protected materials without the owner’s permission is not permitted.</p><h3>Brand</h3><p>The Quizy name, logo and visual identity belong to the Quizy project and are owned by Uche Promise Egbe.</p><p class="cloud-note">© 2026 Uche Promise Egbe. All rights reserved.</p><div class="cloud-actions" style="justify-content:center"><button class="btn primary" id="quizyLegalClose">Close</button></div></div>';document.body.appendChild(w);document.getElementById('quizyLegalClose').onclick=()=>w.remove();w.onclick=e=>{if(e.target===w)w.remove()}}
 function accountLabel''',
              s,
              count=1,
              flags=re.S
          )

          # Add a polished blue welcome splash using the existing Quizy app icon (baby logo).
          if 'id="quizyWelcomeSplash"' not in s:
              splash=r'''<div id="quizyWelcomeSplash" aria-label="Welcome to Quizy">
  <div class="quizy-splash-glow"></div>
  <div class="quizy-splash-content">
    <div class="quizy-splash-logo-wrap"><img src="/icon-512.png" alt="Quizy logo" class="quizy-splash-logo"></div>
    <div class="quizy-splash-title">Welcome back to Quizy Land</div>
    <div class="quizy-splash-sub">Your next adventure is waiting...</div>
    <div class="quizy-splash-dots"><i></i><i></i><i></i></div>
  </div>
</div>
<style>
#quizyWelcomeSplash{position:fixed;inset:0;z-index:1000000;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#071f5c 0%,#0b5ed7 48%,#18a7e8 100%);transition:opacity .55s ease,visibility .55s ease}
#quizyWelcomeSplash.hide{opacity:0;visibility:hidden;pointer-events:none}
#quizyWelcomeSplash:before,#quizyWelcomeSplash:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.28}
#quizyWelcomeSplash:before{width:55vw;height:55vw;max-width:620px;max-height:620px;background:#73d7ff;top:-20%;left:-12%;animation:quizyOrb 5s ease-in-out infinite}
#quizyWelcomeSplash:after{width:45vw;height:45vw;max-width:520px;max-height:520px;background:#8f7cff;right:-10%;bottom:-18%;animation:quizyOrb 6s ease-in-out infinite reverse}
.quizy-splash-content{position:relative;z-index:2;text-align:center;color:#fff;padding:28px}
.quizy-splash-logo-wrap{width:190px;height:190px;margin:0 auto 24px;display:grid;place-items:center;animation:quizyLogoFloat 1.9s ease-in-out infinite}
.quizy-splash-logo{width:178px;height:178px;object-fit:contain;filter:drop-shadow(0 18px 28px rgba(0,0,0,.28));animation:quizyLogoPulse 1.9s ease-in-out infinite}
.quizy-splash-title{font-size:clamp(27px,7vw,44px);font-weight:950;letter-spacing:-1px;text-shadow:0 4px 20px rgba(0,0,0,.22)}
.quizy-splash-sub{margin-top:9px;font-size:15px;font-weight:700;opacity:.9}
.quizy-splash-dots{display:flex;justify-content:center;gap:7px;margin-top:22px}
.quizy-splash-dots i{width:7px;height:7px;border-radius:50%;background:#fff;animation:quizyDot 1.1s infinite ease-in-out}
.quizy-splash-dots i:nth-child(2){animation-delay:.15s}.quizy-splash-dots i:nth-child(3){animation-delay:.3s}
@keyframes quizyLogoFloat{0%,100%{transform:translateY(0) rotate(-2deg) scale(1)}50%{transform:translateY(-12px) rotate(2deg) scale(1.04)}}
@keyframes quizyLogoPulse{0%,100%{transform:scale(.98)}50%{transform:scale(1.05)}}
@keyframes quizyOrb{50%{transform:translate(35px,25px) scale(1.12)}}
@keyframes quizyDot{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
@media(max-width:520px){.quizy-splash-logo-wrap{width:155px;height:155px}.quizy-splash-logo{width:145px;height:145px}}
</style>
<script>
(function(){
  function hideSplash(){
    var s=document.getElementById('quizyWelcomeSplash');
    if(!s)return;
    setTimeout(function(){s.classList.add('hide');setTimeout(function(){s.remove()},650)},1800);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hideSplash);else hideSplash();
})();
</script>
'''
              marker='</body>'
              if marker not in s: raise SystemExit('Body marker not found')
              s=s.replace(marker,splash+'\n'+marker,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish Quizy welcome screen and legal access"
          git push
      - name: Remove updater
        run: |
          rm -f .github/workflows/quizy-final-polish.yml .quizy-final-polish-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time welcome polish updater"
          git push
