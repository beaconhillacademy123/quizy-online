name: Activate Quizy Command Center Client

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Activate Quizy Command Center client') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/patch_quizy.py
      - name: Commit and push
        run: |
          git config user.name "Quizy Command Center"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Activate Quizy Command Center client"
          git push
