name: Build Quizy Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Quizy signing key
        env:
          KEYSTORE_B64: ${{ secrets.QUIZY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing QUIZY_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/quizy-release.keystore"
      - name: Build signed release APK
        working-directory: android
        env:
          QUIZY_KEYSTORE_FILE: ${{ runner.temp }}/quizy-release.keystore
          QUIZY_KEYSTORE_PASSWORD: ${{ secrets.QUIZY_KEYSTORE_PASSWORD }}
          QUIZY_KEY_PASSWORD: ${{ secrets.QUIZY_KEY_PASSWORD }}
        run: |
          test -n "$QUIZY_KEYSTORE_PASSWORD" || { echo "Missing QUIZY_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$QUIZY_KEY_PASSWORD" || { echo "Missing QUIZY_KEY_PASSWORD"; exit 1; }
          gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Quizy-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
