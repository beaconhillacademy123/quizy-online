name: Fix Quizy startup About handler
on:
  push:
    branches: [main]
    paths: [".quizy-startup-fix-trigger"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="document.getElementById('aboutQuizy')?.addEventListener('click',showQuizyLegal);"
          new="document.getElementById('aboutQuizy')?.addEventListener('click',()=>{if(typeof showQuizyLegal==='function')showQuizyLegal();});"
          if old in s:
              s=s.replace(old,new,1)
          elif "document.getElementById('aboutQuizy').onclick=showQuizyLegal;" in s:
              s=s.replace("document.getElementById('aboutQuizy').onclick=showQuizyLegal;","document.getElementById('aboutQuizy')?.addEventListener('click',()=>{if(typeof showQuizyLegal==='function')showQuizyLegal();});",1)
          else:
              raise SystemExit("About handler not found")
          p.write_text(s,encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Quizy startup caused by deferred About handler"
          git push
      - name: Remove updater
        run: |
          rm -f .github/workflows/quizy-startup-fix.yml .quizy-startup-fix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time startup fix updater"
          git push
