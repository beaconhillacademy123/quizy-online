<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizy Expedition Command Center</title>
<style>
body{margin:0;background:#07111f;color:#eef6ff;font:15px system-ui,Arial}*{box-sizing:border-box}.wrap{max-width:1300px;margin:auto;padding:20px}.card{background:#0e1d31;border:1px solid #24405f;border-radius:16px;padding:18px;margin:12px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:25px;font-weight:900}.muted{color:#91a7bf}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.metric{background:#12263e;border:1px solid #284767;border-radius:14px;padding:15px}.num{font-size:29px;font-weight:900;margin-top:5px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.btn{background:#18324e;color:#fff;border:1px solid #315575;padding:9px 13px;border-radius:9px;font-weight:800;cursor:pointer}.primary{background:#e8bf50;color:#15110a}.danger{background:#51232b}.good{background:#174638}.input,.area{width:100%;background:#081525;color:#fff;border:1px solid #29445f;border-radius:9px;padding:11px;margin:5px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 7px;border-bottom:1px solid #20374f;text-align:left}.table th{font-size:11px;color:#91a7bf;text-transform:uppercase}.msg{padding:10px;border:1px solid #284767;border-radius:10px;margin:7px 0;cursor:pointer}.hidden{display:none}.notice{background:#152b43;padding:10px;border-radius:9px;color:#b8d6ee}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.table th:nth-child(n+5),.table td:nth-child(n+5){display:none}}
</style></head><body><div id="app"><div class="wrap" style="max-width:500px;margin:12vh auto"><div class="card" style="text-align:center"><div style="font-size:55px">🧭</div><div class="brand">Quizy Expedition Command Center</div><p class="muted">Loading owner station…</p></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const URL='https://snxehcpichoskvdtuveh.supabase.co',KEY='sb_publishable_54n8FEVRWSq1A17OeO-lxw_E_74g9Gh',API=URL+'/functions/v1/quizy-command-center',sb=supabase.createClient(URL,KEY);let session,users=[],settings={},tab='home';
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function call(action,data={}){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...data})});let j=await r.json();if(!r.ok)throw Error(j.error||'Command failed');return j}
async function start(){if(!sb){document.getElementById('app').innerHTML='<div class="wrap"><div class="card"><h2>⚠️ Command Center connection unavailable</h2><p class="muted">The secure login service did not load. Please check your internet connection and refresh.</p><button class="btn primary" onclick="location.reload()">↻ Try Again</button></div></div>';return}try{let x=await Promise.race([sb.auth.getSession(),new Promise((_,rej)=>setTimeout(()=>rej(Error('Login service timed out')),8000))]);session=x.data.session;if(!session)return login();let a=await Promise.race([call('whoami'),new Promise((_,rej)=>setTimeout(()=>rej(Error('Command Center connection timed out')),10000))]);if(!a.admin)throw Error('Command Center access denied');await load()}catch(e){if(String(e.message).toLowerCase().includes('timed out')){login();alert('The Command Center connection took too long. Please sign in again.')}else{denied(e.message)}}}
function login(){app.innerHTML='<div class="wrap" style="max-width:500px;margin-top:12vh"><div class="card" style="text-align:center"><div style="font-size:55px">🧭</div><div class="brand">Quizy Expedition Command Center</div><p class="muted">Private owner station</p><input id="em" class="input" placeholder="Owner email" type="email"><input id="pw" class="input" placeholder="Password" type="password"><button class="btn primary" style="width:100%;margin-top:8px" onclick="signin()">Enter Command Center</button></div></div>'}
async function signin(){let x=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(x.error)return alert(x.error.message);session=x.data.session;start()}
function denied(m){app.innerHTML='<div class="wrap"><div class="card"><h2>🔒 Access denied</h2><p class="muted">'+esc(m)+'</p></div></div>'}
async function load(){let [s,u,z]=await Promise.all([call('summary'),call('users'),call('settings')]);window.sum=s;users=u.users||[];settings=z.settings||{};draw()}
function draw(){app.innerHTML='<div class="wrap"><div class="top"><div><div class="brand">🧭 Quizy Expedition Command Center</div><div class="muted">Quizy Expedition Commander · Owner station</div></div><div class="row"><b>OWNER</b><button class="btn" onclick="load()">↻ Refresh</button><button class="btn" onclick="sb.auth.signOut().then(()=>location.reload())">Leave</button></div></div><div class="tabs"><button class="btn" onclick="tab=\'home\';draw()">🗺️ Overview</button><button class="btn" onclick="tab=\'users\';draw()">👥 Explorers</button><button class="btn" onclick="tab=\'msg\';draw()">📜 Messages</button><button class="btn" onclick="tab=\'ctrl\';draw()">⚙️ Controls</button></div><div id="view"></div></div>';tab==='home'?home():tab==='users'?userView():tab==='msg'?msgView():ctrlView()}
function home(){let s=window.sum||{};view.innerHTML='<div class="grid"><div class="metric">👥<div class="num">'+(s.registered_users||0)+'</div><div class="muted">Registered Explorers</div></div><div class="metric">📱<div class="num">'+(s.detected_installations||0)+'</div><div class="muted">Detected Installations</div></div><div class="metric">🟢<div class="num">'+(s.daily_active||0)+'</div><div class="muted">Active Today</div></div><div class="metric">🧭<div class="num">'+(s.daily_players||0)+'</div><div class="muted">Played Today</div></div><div class="metric">❓<div class="num">'+(s.questions_answered||0)+'</div><div class="muted">Questions Today</div></div><div class="metric">🏆<div class="num">'+(s.badges_earned||0)+'</div><div class="muted">Badges Held</div></div></div><div class="card"><h2>📈 Last 14 Days</h2><div class="row">'+(s.daily||[]).map(x=>'<div style="min-width:45px;text-align:center"><div style="height:'+Math.max(5,(x.count||0)*12)+'px;background:#5eb7f0;border-radius:5px"></div><small>'+esc(x.label)+'</small></div>').join('')+'</div><p class="muted">Installation figures are detected browser/app signals, not a universal exact device count.</p></div>'}
function userView(){view.innerHTML='<div class="card"><div class="top"><div><h2>👥 Explorer Roster</h2><div class="muted">Full emails remain hidden.</div></div><input id="q" class="input" style="max-width:320px" placeholder="Search explorer"></div><div style="overflow:auto"><table class="table"><thead><tr><th>Explorer</th><th>Status</th><th>Last Active</th><th>Badges</th><th>Stars</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>';drawUsers()}
function drawUsers(){let q=($('q')?.value||'').toLowerCase(),a=users.filter(u=>(u.display_name+' '+u.email_masked).toLowerCase().includes(q));$('rows').innerHTML=a.map(u=>'<tr><td><b>'+esc(u.display_name)+'</b><br><span class="muted">'+esc(u.email_masked)+'</span></td><td>'+ (u.suspended?'🔒 Suspended':'🟢 Active')+'</td><td>'+ (u.last_active?new Date(u.last_active).toLocaleString():'—')+'</td><td>🏅 '+u.badges+'</td><td>⭐ '+u.total_stars+'</td><td><button class="btn" onclick="messageOne(\''+u.user_id+'\')">📜 Message</button> <button class="btn '+(u.suspended?'good':'danger')+'" onclick="toggle(\''+u.user_id+'\','+(!u.suspended)+')">'+(u.suspended?'Restore':'Suspend')+'</button></td></tr>').join('');$('q').oninput=drawUsers}
async function toggle(id,on){let reason=on?prompt('Reason (optional):','Command Center action'):null;if(on&&reason===null)return;await call('user_action',{user_id:id,action:on?'suspend':'restore',reason});await load()}
const templates={praise:['A message from your Quizy Expedition Commander','I see the effort you are putting into Quizy. Your consistency, progress and determination have not gone unnoticed. Keep exploring, keep learning and keep earning those badges. Great job, Explorer! 🧭🌟'],badge:['Your Quizy adventure is getting noticed!','Congratulations on the badges you are earning! Keep exploring — more discoveries are waiting for you. 🏆🗺️'],streak:['Keep your Quizy streak alive!','Your consistency is impressive. Keep coming back, keep challenging yourself and protect that streak. 🔥🧭'],encourage:['A little encouragement from Quizy','Keep trying, keep improving and never be afraid of a difficult question. You are doing well! 🌟']};
function msgView(){view.innerHTML='<div class="card"><h2>📜 Send Explorer Message</h2><div class="notice">You select explorers by name. Their full email addresses are not shown. The secure server resolves delivery addresses.</div><div class="row" style="margin:12px 0">'+Object.keys(templates).map(k=>'<button class="btn" onclick="useTemplate(\''+k+'\')">'+templates[k][0]+'</button>').join('')+'</div><input id="ms" class="input" placeholder="Subject"><textarea id="mb" class="area" rows="7" placeholder="Write your message"></textarea><div class="card" style="max-height:300px;overflow:auto">'+users.map(u=>'<label style="display:block;padding:8px;border-bottom:1px solid #20374f"><input class="pick" type="checkbox" value="'+u.user_id+'"> <b>'+esc(u.display_name)+'</b> <span class="muted">'+esc(u.email_masked)+'</span></label>').join('')+'</div><button class="btn primary" onclick="sendMsg()">🚀 Send Message</button></div>'}
function useTemplate(k){$('ms').value=templates[k][0];$('mb').value=templates[k][1]}
function messageOne(id){tab='msg';draw();setTimeout(()=>{let x=document.querySelector('.pick[value="'+id+'"]');if(x){x.checked=true;x.scrollIntoView({block:'center'})}},80)}
async function sendMsg(){let ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);if(!ids.length)return alert('Select at least one explorer.');let subject=$('ms').value.trim(),message=$('mb').value.trim();if(!subject||!message)return alert('Add subject and message.');let r=await call('send_message',{user_ids:ids,subject,message,email_requested:true,sender_name:'Quizy Expedition Commander'});alert('Delivered inside Quizy to '+r.sent_count+' explorer(s). '+(r.email_status||''))}
function ctrlView(){let b=k=>settings[k]===true;view.innerHTML='<div class="card"><h2>⚙️ Expedition Controls</h2>'+[['maintenance_mode','🚧 Maintenance Mode'],['registrations_enabled','📝 New Registrations'],['feature_battle','⚔️ Bluetooth Battle'],['feature_current_affairs','📰 Current Affairs'],['feature_sports','🏆 Sports Arena'],['feature_daily_challenge','🎯 Daily Challenge'],['music_enabled','🎵 Background Music'],['force_update','⬆️ Force Update']].map(x=>'<label style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #20374f"><span>'+x[1]+'</span><input type="checkbox" data-s="'+x[0]+'" '+(b(x[0])?'checked':'')+'></label>').join('')+'<label class="muted">Minimum app version</label><input id="ver" class="input" value="'+esc(settings.min_app_version||'2.2.1')+'"><label class="muted">Global announcement</label><textarea id="ann" class="area" rows="3">'+esc(settings.announcement||'')+'</textarea><button class="btn primary" onclick="saveCtrl()">💾 Save Controls</button></div>'}
async function saveCtrl(){let o={};document.querySelectorAll('[data-s]').forEach(x=>o[x.dataset.s]=x.checked);o.min_app_version=$('ver').value.trim();o.announcement=$('ann').value.trim()||null;await call('save_settings',{settings:o});alert('Command settings saved.');await load()}
start();
</script></body></html>
