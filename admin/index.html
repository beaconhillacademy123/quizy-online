{const e=document.getElementById('err');e.textContent='Authenticating…';try{const r=await fetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value})}),j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||'Invalid login credentials');token=j.access_token;await boot()}catch(x){e.textContent=x.message}}async function call(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':KEY},body:JSON.stringify({action,...data})}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||j.message||('Command failed ('+r.status+')'));return j}async function boot(){try{const me=await call('whoami');if(!me.admin)throw Error('Command Center access denied for this account.');await load()}catch(x){app.innerHTML='<div style="max-width:520px;margin:15vh auto;padding:20px;text-align:center;color:#fff;background:#0e1d31;border-radius:18px"><h2>🔒 Access denied</h2><p>'+esc(x.message)+'</p><button onclick="login()">Return to Login</button></div>'}}async function load(){const a=await Promise.all([call('summary'),call('users'),call('settings')]);summary=a[0];users=a[1].users||[];settings=a[2].settings||{};draw()}function draw(){app.innerHTML='<div style="max-width:1200px;margin:auto;padding:20px;color:#eef6ff;font:15px system-ui"><h2>🧭 Quizy Expedition Command Center</h2><p>Quizy Expedition Commander · Owner station</p><button onclick="load()">↻ Refresh</button> <button onclick="location.reload()">Leave</button><div id="view"></div></div>';view.innerHTML='<div style="padding:20px;background:#0e1d31;border-radius:18px;margin-top:15px"><h3>Overview</h3><p>👥 Registered Explorers: <b>'+(summary.registered_users||0)+'</b></p><p>📱 Detected Installations: <b>'+(summary.detected_installations||0)+'</b></p><p>🟢 Active Today: <b>'+(summary.daily_active||0)+'</b></p><p>🧭 Played Today: <b>'+(summary.daily_players||0)+'</b></p><p>❓ Questions Today: <b>'+(summary.questions_answered||0)+'</b></p><p>🏆 Badges Held: <b>'+(summary.badges_earned||0)+'</b></p></div>'}login();</script></body></html>
