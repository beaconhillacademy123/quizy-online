<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="/admin/manifest.json"><meta name="theme-color" content="#07111f"><link rel="apple-touch-icon" href="/admin/admin-icon-192.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quizy Expedition Command Center</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef6ff;font:15px system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#0e1d31;border:1px solid #294663;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 12px 35px #0003}
.brand{font-size:25px;font-weight:900}.muted{color:#91a7bf}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.metric{background:#12263e;border:1px solid #294967;border-radius:14px;padding:15px}.num{font-size:28px;font-weight:900;margin-top:5px}
.btn{background:#18324e;color:#fff;border:1px solid #315575;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#e8bf50;color:#15110a}.danger{background:#51232b}.good{background:#174638}
.input,.area{width:100%;background:#081525;color:#fff;border:1px solid #29445f;border-radius:10px;padding:12px;margin:6px 0}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 7px;border-bottom:1px solid #20374f;text-align:left}.table th{font-size:11px;color:#91a7bf;text-transform:uppercase}.notice{background:#152b43;padding:12px;border-radius:10px}
.hidden{display:none}.center{text-align:center}.error{color:#ffb4b4;background:#3b1820;border:1px solid #6e2c38;padding:10px;border-radius:9px;margin-top:10px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}.table th:nth-child(n+5),.table td:nth-child(n+5){display:none}}
</style>
</head>
<body>
<div id="app"><div class="wrap" style="max-width:520px;margin-top:12vh"><div class="card center"><img src="/admin/admin-icon-192.png" alt="Quizy Command Center" style="width:96px;height:96px;border-radius:22px;object-fit:cover"><div class="brand">Quizy Expedition Command Center</div><p class="muted">Owner station</p><div id="status">Preparing secure access…</div></div></div></div>
<script>
const SUPA='https://snxehcpichoskvdtuveh.supabase.co';
const KEY='sb_publishable_54n8FEVRWSq1A17OeO-lxw_E_74g9Gh';
const API=SUPA+'/functions/v1/quizy-command-center';
let token='',users=[],settings={},summary={},tab='home';
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function login(){
 app.innerHTML='<div class="wrap" style="max-width:520px;margin-top:10vh"><div class="card center"><img src="/admin/admin-icon-192.png" alt="Quizy Command Center" style="width:96px;height:96px;border-radius:22px;object-fit:cover"><div class="brand">Quizy Expedition Command Center</div><p class="muted">Private owner station</p><input id="em" class="input" type="email" placeholder="Owner email" autocomplete="username"><input id="pw" class="input" type="password" placeholder="Password" autocomplete="current-password"><button class="btn primary" style="width:100%;margin-top:8px" onclick="signin()">Enter Command Center</button><div id="err"></div></div></div>';
}
async function signin(){
 const e=document.getElementById('err'); e.innerHTML='<p class="muted">Authenticating…</p>';
 try{
  const r=await fetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value})});
  const j=await r.json(); if(!r.ok) throw Error(j.error_description||j.msg||'Invalid login credentials');
  token=j.access_token; await boot();
 }catch(x){e.innerHTML='<div class="error">'+esc(x.message)+'</div>'}
}
async function call(action,data={}){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':KEY},body:JSON.stringify({action,...data})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(j.error||j.message||('Command failed ('+r.status+')'));
 return j;
}
async function boot(){
 try{
  const me=await call('whoami'); if(!me.admin)throw Error('Command Center access denied for this account.');
  await load();
 }catch(x){app.innerHTML='<div class="wrap"><div class="card center"><div style="font-size:50px">🔒</div><h2>Access denied</h2><p class="muted">'+esc(x.message)+'</p><button class="btn" onclick="login()">Return to Login</button></div></div>'}
}
async function load(){const a=await Promise.all([call('summary'),call('users'),call('settings')]);summary=a[0];users=a[1].users||[];settings=a[2].settings||{};draw()}
function draw(){
 app.innerHTML='<div class="wrap"><div class="row" style="justify-content:space-between"><div><div class="brand">🧭 Quizy Expedition Command Center</div><div class="muted">Quizy Expedition Commander · Owner station</div></div><div class="row"><button class="btn" onclick="load()">↻ Refresh</button><button class="btn" onclick="location.reload()">Leave</button></div></div><div class="tabs"><button class="btn" onclick="tab=\'home\';draw()">🗺️ Overview</button><button class="btn" onclick="tab=\'users\';draw()">👥 Explorers</button><button class="btn" onclick="tab=\'msg\';draw()">📜 Messages</button><button class="btn" onclick="tab=\'ctrl\';draw()">⚙️ Controls</button></div><div id="view"></div></div>';
 tab==='home'?home():tab==='users'?userView():tab==='msg'?msgView():ctrlView();
}
function home(){const s=summary;view.innerHTML='<div class="grid"><div class="metric">👥<div class="num">'+(s.registered_users||0)+'</div><div class="muted">Registered Explorers</div></div><div class="metric">📱<div class="num">'+(s.detected_installations||0)+'</div><div class="muted">Detected Installations</div></div><div class="metric">🟢<div class="num">'+(s.daily_active||0)+'</div><div class="muted">Active Today</div></div><div class="metric">🧭<div class="num">'+(s.daily_players||0)+'</div><div class="muted">Played Today</div></div><div class="metric">❓<div class="num">'+(s.questions_answered||0)+'</div><div class="muted">Questions Today</div></div><div class="metric">🏆<div class="num">'+(s.badges_earned||0)+'</div><div class="muted">Badges Held</div></div></div><div class="card"><h2>📈 Last 14 Days</h2><div class="row">'+(s.daily||[]).map(x=>'<div style="min-width:45px;text-align:center"><div style="height:'+Math.max(5,(x.count||0)*12)+'px;background:#5eb7f0;border-radius:5px"></div><small>'+esc(x.label)+'</small></div>').join('')+'</div><p class="muted">Installation figures are detected app/browser signals, not an exact universal device count.</p></div>'}
function userView(){view.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><div><h2>👥 Explorer Roster</h2><div class="muted">Full email addresses remain hidden.</div></div><input id="q" class="input" style="max-width:320px" placeholder="Search explorer" oninput="drawUsers()"></div><div style="overflow:auto"><table class="table"><thead><tr><th>Explorer</th><th>Status</th><th>Last Active</th><th>Badges</th><th>Stars</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>';drawUsers()}
function drawUsers(){const q=(document.getElementById('q')?.value||'').toLowerCase();const a=users.filter(u=>(u.display_name+' '+u.email_masked).toLowerCase().includes(q));document.getElementById('rows').innerHTML=a.map(u=>'<tr><td><b>'+esc(u.display_name)+'</b><br><span class="muted">'+esc(u.email_masked)+'</span></td><td>'+(u.suspended?'🔒 Suspended':'🟢 Active')+'</td><td>'+(u.last_active?new Date(u.last_active).toLocaleString():'—')+'</td><td>🏅 '+u.badges+'</td><td>⭐ '+u.total_stars+'</td><td><button class="btn" onclick="messageOne(\''+u.user_id+'\')">📜 Message</button> <button class="btn '+(u.suspended?'good':'danger')+'" onclick="toggleUser(\''+u.user_id+'\','+(!u.suspended)+')">'+(u.suspended?'Restore':'Suspend')+'</button></td></tr>').join('')}
async function toggleUser(id,on){let reason=on?prompt('Reason (optional):','Command Center action'):null;if(on&&reason===null)return;await call('user_action',{user_id:id,action:on?'suspend':'restore',reason});await load()}
const templates={praise:['Outstanding Explorer','I see the effort you are putting into Quizy. Your consistency, progress and determination have not gone unnoticed. Keep exploring, keep learning and keep earning those badges. Great job, Explorer! 🧭🌟'],badge:['Badge Hunter','Congratulations on the badges you are earning! Keep exploring — more discoveries are waiting for you. 🏆🗺️'],streak:['Streak Champion','Your consistency is impressive. Keep coming back, keep challenging yourself and protect that streak. 🔥🧭'],encourage:['Keep Exploring','Keep trying, keep improving and never be afraid of a difficult question. You are doing well! 🌟']};
function msgView(){view.innerHTML='<div class="card"><h2>📜 Send Explorer Message</h2><div class="notice">Select explorers by name. Their full email addresses are not shown.</div><div class="row" style="margin:12px 0">'+Object.keys(templates).map(k=>'<button class="btn" onclick="useTemplate(\''+k+'\')">'+templates[k][0]+'</button>').join('')+'</div><input id="ms" class="input" placeholder="Subject"><textarea id="mb" class="area" rows="7" placeholder="Write your message"></textarea><div class="card" style="max-height:300px;overflow:auto">'+users.map(u=>'<label style="display:block;padding:9px;border-bottom:1px solid #20374f"><input class="pick" type="checkbox" value="'+u.user_id+'"> <b>'+esc(u.display_name)+'</b> <span class="muted">'+esc(u.email_masked)+'</span></label>').join('')+'</div><button class="btn primary" onclick="sendMsg()">🚀 Send Message</button></div>'}
function useTemplate(k){document.getElementById('ms').value=templates[k][0];document.getElementById('mb').value=templates[k][1]}
function messageOne(id){tab='msg';draw();setTimeout(()=>{const x=document.querySelector('.pick[value="'+id+'"]');if(x){x.checked=true;x.scrollIntoView({block:'center'})}},100)}
async function sendMsg(){const ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);if(!ids.length)return alert('Select at least one explorer.');const subject=document.getElementById('ms').value.trim(),message=document.getElementById('mb').value.trim();if(!subject||!message)return alert('Add subject and message.');const r=await call('send_message',{user_ids:ids,subject,message,email_requested:true,sender_name:'Quizy Expedition Commander'});alert('Delivered inside Quizy to '+r.sent_count+' explorer(s). '+(r.email_status||''))}
function ctrlView(){const b=k=>settings[k]===true;view.innerHTML='<div class="card"><h2>⚙️ Expedition Controls</h2>'+[['maintenance_mode','🚧 Maintenance Mode'],['registrations_enabled','📝 New Registrations'],['feature_battle','⚔️ Bluetooth Battle'],['feature_current_affairs','📰 Current Affairs'],['feature_sports','🏆 Sports Arena'],['feature_daily_challenge','🎯 Daily Challenge'],['music_enabled','🎵 Background Music'],['force_update','⬆️ Force Update']].map(x=>'<label style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #20374f"><span>'+x[1]+'</span><input type="checkbox" data-s="'+x[0]+'" '+(b(x[0])?'checked':'')+'></label>').join('')+'<label class="muted">Minimum app version</label><input id="ver" class="input" value="'+esc(settings.min_app_version||'2.2.1')+'"><label class="muted">Global announcement</label><textarea id="ann" class="area" rows="3">'+esc(settings.announcement||'')+'</textarea><button class="btn primary" onclick="saveCtrl()">💾 Save Controls</button></div>'}
async function saveCtrl(){const o={};document.querySelectorAll('[data-s]').forEach(x=>o[x.dataset.s]=x.checked);o.min_app_version=document.getElementById('ver').value.trim();o.announcement=document.getElementById('ann').value.trim()||null;await call('save_settings',{settings:o});alert('Command settings saved.');await load()}
login();
</script>
</body></html>
