<!-- QUIZY_COMMAND_CENTER_TELEMETRY_V1 -->
<script>
(function(){
const W=window, K='quizy_command_install_key';
async function run(){
 let cloud=null,user=null;
 for(let i=0;i<80;i++){cloud=W.QuizyCloud?.supabase;user=W.QuizyCloud?.user;if(cloud&&user)break;await new Promise(r=>setTimeout(r,500))}
 if(!cloud||!user)return;
 const activity=async(e,m={})=>{try{await cloud.from('quizy_activity').insert({user_id:user.id,event_type:e,metadata:m})}catch(x){}};
 let key=localStorage.getItem(K);if(!key){key=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();localStorage.setItem(K,key)}
 const platform=/Android/i.test(navigator.userAgent)?'android':/iPhone|iPad/i.test(navigator.userAgent)?'ios':'web';
 try{await cloud.from('quizy_installations').upsert({user_id:user.id,install_key:key,platform,last_seen_at:new Date().toISOString()},{onConflict:'user_id,install_key'});await activity('app_open',{path:location.pathname})}catch(x){}
 W.addEventListener('appinstalled',()=>activity('app_installed',{}));
 const wrap=n=>{const f=W[n];if(typeof f!=='function'||f.__cc)return;const g=function(){const r=f.apply(this,arguments);activity(n==='startGame'?'expedition_start':'expedition_complete',{});return r};g.__cc=true;W[n]=g};
 wrap('startGame');wrap('finishLand');
 setInterval(()=>{user=W.QuizyCloud?.user||user;wrap('startGame');wrap('finishLand')},10000);
}
run();
})();
</script>
